name: cartservice image

# Publishes the multi-arch cartservice image that release/kubernetes.yaml uses.
# Pull requests only build it; pushes to master also publish it.

on:
  push:
    branches: [master]
    paths:
      - release/cartservice.Dockerfile
      - services/src/cartservice/src/**
      - .github/workflows/cartservice-image.yaml
  pull_request:
    paths:
      - release/cartservice.Dockerfile
      - services/src/cartservice/src/**
      - .github/workflows/cartservice-image.yaml
  workflow_dispatch:

env:
  IMAGE: ghcr.io/crafting-demo/boutique/cartservice
  # The Boutique release the vendored source and the manifest are pinned to.
  VERSION: v0.6.0

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services/src/cartservice/src
          file: release/cartservice.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:${{ env.VERSION }}-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
