name: images

# Publishes the multi-arch (amd64, arm64) service images that
# release/kubernetes.yaml runs, so the demo pulls nothing from gcr.io.
# Pull requests only build them; pushes to master also publish them.

on:
  push:
    branches: [master]
    paths:
      - services/src/**
      - release/*.Dockerfile
      - .github/workflows/images.yaml
  pull_request:
    paths:
      - services/src/**
      - release/*.Dockerfile
      - .github/workflows/images.yaml
  workflow_dispatch:

env:
  REGISTRY: ghcr.io/crafting-demo/boutique
  # The Boutique release the vendored source and the manifest are pinned to.
  VERSION: v0.6.0

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - adservice
          - cartservice
          - checkoutservice
          - currencyservice
          - emailservice
          - frontend
          - paymentservice
          - productcatalogservice
          - recommendationservice
          - shippingservice
        include:
          # The upstream cartservice Dockerfile cannot target arm64.
          - service: cartservice
            context: services/src/cartservice/src
            file: release/cartservice.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context || format('services/src/{0}', matrix.service) }}
          file: ${{ matrix.file || format('services/src/{0}/Dockerfile', matrix.service) }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.service }}:${{ env.VERSION }}
            ${{ env.REGISTRY }}/${{ matrix.service }}:${{ env.VERSION }}-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
